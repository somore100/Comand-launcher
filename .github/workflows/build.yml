name: Build Releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-linux-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: pip install pyinstaller pynput pystray

      - name: Build binary with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name CommandVault --icon packaging/icon.ico \
            --hidden-import pynput.keyboard._xorg \
            --hidden-import pynput.mouse._xorg \
            --hidden-import pystray._xorg \
            main.py

      - name: Assemble AppDir
        run: |
          mkdir -p CommandVault.AppDir/usr/bin
          cp dist/CommandVault CommandVault.AppDir/usr/bin/
          cp packaging/icon.png CommandVault.AppDir/command-vault.png
          cp packaging/command-vault.desktop CommandVault.AppDir/command-vault.desktop
          cat > CommandVault.AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          exec "${HERE}/usr/bin/CommandVault" "$@"
          EOF
          chmod +x CommandVault.AppDir/AppRun CommandVault.AppDir/usr/bin/CommandVault

      - name: Download appimagetool
        run: |
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool

      - name: Build AppImage
        run: |
          ./appimagetool --appimage-extract-and-run CommandVault.AppDir CommandVault-x86_64.AppImage

      - name: Build .deb, .rpm and Arch packages
        run: |
          sudo apt-get install -y ruby rpm libarchive-tools zstd
          sudo gem install --no-document fpm
          VERSION=$(python3 -c "import re;print(re.search(r'APP_VERSION = \"([^\"]+)\"', open('cmdvault/config.py').read()).group(1))")
          mkdir -p pkgroot/usr/bin pkgroot/usr/share/applications pkgroot/usr/share/icons/hicolor/256x256/apps
          install -m755 dist/CommandVault pkgroot/usr/bin/command-vault
          sed -e 's|^Exec=.*|Exec=command-vault|' -e 's|^Icon=.*|Icon=command-vault|' \
            packaging/command-vault.desktop > pkgroot/usr/share/applications/command-vault.desktop
          install -m644 packaging/icon.png pkgroot/usr/share/icons/hicolor/256x256/apps/command-vault.png
          for T in deb rpm pacman; do
            fpm -s dir -t "$T" -n command-vault -v "$VERSION" --architecture x86_64 \
              --description "Command Vault: launcher for commands, scripts and bots" \
              --url "https://github.com/somore100/Comand-launcher" -C pkgroot .
          done
          ls -l *.deb *.rpm *.pkg.tar.*

      - name: Upload Linux package artifacts
        uses: actions/upload-artifact@v5
        with:
          name: CommandVault-Linux-packages
          path: |
            *.deb
            *.rpm
            *.pkg.tar.*

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v5
        with:
          name: CommandVault-Linux-AppImage
          path: CommandVault-x86_64.AppImage

  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyinstaller pynput pystray

      - name: Build exe with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name CommandVault --icon packaging/icon.ico `
            --hidden-import pynput.keyboard._win32 `
            --hidden-import pynput.mouse._win32 `
            --hidden-import pystray._win32 `
            main.py

      - name: Upload exe artifact
        uses: actions/upload-artifact@v5
        with:
          name: CommandVault-Windows-exe
          path: dist/CommandVault.exe

  build-macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyinstaller pynput pystray

      - name: Build .app with PyInstaller
        run: |
          pyinstaller --windowed --name CommandVault --icon packaging/icon.icns \
            --hidden-import pynput.keyboard._darwin \
            --hidden-import pynput.mouse._darwin \
            --hidden-import pystray._darwin \
            main.py

      - name: Package into .dmg
        run: |
          hdiutil create -volname "Command Vault" -srcfolder dist/CommandVault.app \
            -ov -format UDZO CommandVault-macOS.dmg

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v5
        with:
          name: CommandVault-macOS-dmg
          path: CommandVault-macOS.dmg

  release:
    needs: [build-linux-appimage, build-windows-exe, build-macos-dmg]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/CommandVault-Linux-AppImage/CommandVault-x86_64.AppImage
            artifacts/CommandVault-Linux-packages/*
            artifacts/CommandVault-Windows-exe/CommandVault.exe
            artifacts/CommandVault-macOS-dmg/CommandVault-macOS.dmg
